name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests
      - run: ./build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: CAT-Analyst-Windows-x64
          path: |
            release/CAT-Analyst.exe
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME release/CAT-Analyst.exe release/SHA256SUMS.txt --generate-notes
